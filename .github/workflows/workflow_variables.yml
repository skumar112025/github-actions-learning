name: Environment Variable Demo

on:
  push:
    branches:
      - main
env:
  APP_NAME: my-demo-app
  ENVIRONMENT: dev

jobs:
  show-variables:
    runs-on: ubuntu-latest

    steps:
      - name: Show application name
        run: |
          echo "Application: $APP_NAME"

      - name: Show environment
        run: |
          echo "Environment: $ENVIRONMENT"

      - name: Show both
        run: echo "Deploying $APP_NAME to $ENVIRONMENT"