name: GitHub Actions Basics

on:
  push:
    branches:
      - main

jobs:
  basics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Git version
        run: git --version

      - name: Show current directory
        run: pwd

      - name: List files
        run: ls -la

      - name: Show runner operating system
        run: uname -a

  